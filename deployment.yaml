
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-app-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-app-k8s
  template:
    metadata:
      labels:
        app: cloud-app-k8s
    spec:
      containers:
        - name: cloud-app-k8s
          image: sukhmeet123/cloud-app:latest
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
